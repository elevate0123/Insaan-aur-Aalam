
<style>
#erd { width: 100%; overflow-x: auto; }
#erd svg { min-width: 900px; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryTextColor: dark ? '#CECBF6' : '#26215C',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    secondaryTextColor: dark ? '#9FE1CB' : '#04342C',
    secondaryBorderColor: dark ? '#1D9E75' : '#1D9E75',
    tertiaryColor: dark ? '#633806' : '#FAEEDA',
    tertiaryTextColor: dark ? '#FAC775' : '#412402',
    tertiaryBorderColor: dark ? '#BA7517' : '#BA7517',
  },
});

const diagram = `erDiagram

  name {
    int name_id PK
    string arabic_form
    string transliteration
    string english_meaning
    string arabic_root
    string grammatical_form
    int tier
    int jjk_class_id FK
    int jjk_sub_id FK
    string semantic_domain
    string sifat_type
    float polarity_weight
    bool salbiyya_flag
    bool homonym_flag
    int source_count
    bool in_ghazali
    bool in_tirmidhi
    bool in_ibn_qayyim
    bool include_in_network
    string node_color_group
    string shared_root_pairs
    string reviewer_notes
    string date_reviewed
  }

  verse {
    int verse_id PK
    int surah_id FK
    int ayah_number
    string arabic_text
    string period
    int revelation_order_approx
    string meccan_medinan
  }

  surah {
    int surah_id PK
    int surah_number
    string surah_name_arabic
    string surah_name_english
    string period
    int verse_count
  }

  dyad {
    int dyad_id PK
    int verse_id FK
    int name1_id FK
    int name2_id FK
    int word_distance
    string grammatical_position
    string jjk_pair_type
    int rel_type_id FK
    int theme_macro_id FK
    int theme_micro_id FK
    float polarity_tension_index
    float signed_tension
    bool triple_flag
    bool hapax_flag
    string refrain_type
    float semantic_surprise_bits
    string surprise_category
    string hitl_priority
    bool include_in_network
  }

  hitl_validation {
    int hitl_id PK
    int dyad_id FK
    bool razi_consulted
    bool tabari_consulted
    bool ibn_kathir_consulted
    bool qurtubi_consulted
    bool classical_explanation_found
    string classical_source_cited
    string confirms_signal
    string researcher_notes
    string date_reviewed
    string reviewer_name
    string irr_stratum
  }

  dyad_stats {
    int stats_id PK
    int name1_id FK
    int name2_id FK
    int raw_frequency
    int meccan_count
    int medinan_count
    int verse_final_count
    int mid_verse_count
    int surah_count
    float npmi
    float npmi_ci_lower
    float npmi_ci_upper
    float z_score
    float p_value
    bool significant
    float canonicity_score
    string dyad_class
    float dyadic_entropy_n1
    float dyadic_entropy_n2
  }

  network_edge {
    int edge_id PK
    int name1_id FK
    int name2_id FK
    int raw_weight
    float npmi_weight
    string jjk_pair_type
    int rel_type_id FK
    bool canonical
  }

  jjk_class {
    int jjk_class_id PK
    string class_code
    string class_label
    string class_description
  }

  theme {
    int theme_id PK
    int parent_theme_id FK
    string level
    string theme_code
    string theme_label
    string theme_description
  }

  rel_type {
    int rel_type_id PK
    string type_code
    string type_label
    string decision_path
    string description
  }

  name ||--o{ dyad : "name1"
  name ||--o{ dyad : "name2"
  verse ||--o{ dyad : "contains"
  surah ||--o{ verse : "has"
  dyad ||--|| hitl_validation : "audited by"
  name ||--o{ dyad_stats : "name1_stats"
  name ||--o{ dyad_stats : "name2_stats"
  name ||--o{ network_edge : "name1_edge"
  name ||--o{ network_edge : "name2_edge"
  jjk_class ||--o{ name : "classifies"
  theme ||--o{ dyad : "macro_theme"
  theme ||--o{ dyad : "micro_theme"
  theme ||--o{ theme : "parent"
  rel_type ||--o{ dyad : "typed_as"
  rel_type ||--o{ network_edge : "typed_as"
`;

const { svg } = await mermaid.render('erd-main', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
